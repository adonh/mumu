name: CodeQL

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: '31 3 * * 6'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, go ]
        # CodeQL supports the following values keywords for 'language':
        # 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python',
        # 'ruby', 'rust', 'swift'
        # Learn more about CodeQL language support at https://git.io/codeql-language-support
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # optionally disable:
          queries: security-extended
          # optionally specify:
          #source-root: src

      # Autobuild attempts to build any compiled languages (C/C++, C#, or Java).
      # If this step fails, then you should remove it and run the build manually (see docs)
      #- name: Autobuild
      #  uses: github/codeql-action/autobuild@v4
      #
      # If the Autobuild fails above, remove it and uncomment the following three lines and
      # modify them (or add more) to build your code if your project uses a compiled language
      #- run: |
      #   make bootstrap
      #   make release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: /language:${{matrix.language}}
